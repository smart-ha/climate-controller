set_temperature:
  name: Set Temperature
  description: Set target temperature for climate device
  target:
    entity:
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Target temperature
      required: true
      example: 22
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

set_hvac_mode:
  name: Set HVAC Mode
  description: Set HVAC mode for climate device
  target:
    entity:
      domain: climate
  fields:
    hvac_mode:
      name: HVAC Mode
      description: Target HVAC mode
      required: true
      example: "heat"
      selector:
        select:
          options:
            - "auto"
            - "cool"
            - "heat"
            - "off"

set_occupancy_slot:
  name: Set occupancy slot
  description: >-
    Force one or more cells of the 24×7 presence grid on or off, or hand them
    back to what the motion sensors learned. Days and hours are applied as a
    rectangle — every listed day × every listed hour.
  target:
    entity:
      integration: climate_controller
      domain: climate
  fields:
    day:
      name: Day of week
      description: 0 = Monday … 6 = Sunday. A single value or a list.
      required: true
      example: 0
      selector:
        object:
    hour:
      name: Hour
      description: 0–23. A single value or a list.
      required: true
      example: 7
      selector:
        object:
    mode:
      name: Mode
      description: >-
        active = always expected, inactive = never expected, auto = drop the
        override and follow the learned history.
      required: true
      example: "active"
      selector:
        select:
          options:
            - "auto"
            - "active"
            - "inactive"

clear_occupancy_overrides:
  name: Clear occupancy overrides
  description: >-
    Drop every manual cell, leaving a purely learned week. The learned history
    itself is untouched.
  target:
    entity:
      integration: climate_controller
      domain: climate

reset_occupancy_learning:
  name: Reset occupancy learning
  description: >-
    Forget the observed motion history and start learning the week again.
    Manual cells are kept.
  target:
    entity:
      integration: climate_controller
      domain: climate
